<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · TaskFlow</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container-xl py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <div>
        <h1 class="h3 mb-0">Panel de control</h1>
        <p class="text-muted small mb-0">Resumen de avance por proyecto</p>
      </div>
      <button id="btnNewProject" class="btn btn-primary d-none" data-bs-toggle="modal" data-bs-target="#projectModal">
        <i class="bi bi-plus-lg me-1"></i>Nuevo proyecto
      </button>
    </div>

    <!-- totales generales -->
    <div class="row g-3 mb-4" id="totals"></div>

    <h2 class="h5 mb-3">Proyectos</h2>
    <div id="projects" class="row g-3">
      <div class="col-12 text-center text-muted py-5">
        <div class="spinner-border spinner-border-sm me-2"></div>Cargando…
      </div>
    </div>
  </main>

  <!-- crear / editar proyecto (admin) -->
  <div class="modal fade" id="projectModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="projectForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title">Nuevo proyecto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="id">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" name="name" maxlength="120">
          </div>
          <div class="mb-1">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" name="description" rows="3" maxlength="500"></textarea>
          </div>
          <p class="form-text mb-0">Se crea con un tablero inicial y sus 4 columnas de estado.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- miembros del proyecto (admin) -->
  <div class="modal fade" id="membersModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-people me-1"></i>Miembros · <span class="project-name"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="addMemberForm" class="input-group mb-3" novalidate>
            <select class="form-select" name="user_id"></select>
            <button class="btn btn-primary" type="submit"><i class="bi bi-person-plus"></i> Agregar</button>
          </form>
          <ul class="list-group" id="membersList"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/dashboard.js"></script>
</body>
</html>
