<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tablero · TaskFlow</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container-fluid py-3 px-3 px-md-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb small mb-1">
            <li class="breadcrumb-item"><a href="/dashboard">Dashboard</a></li>
            <li class="breadcrumb-item active" id="crumbProject">…</li>
          </ol>
        </nav>
        <h1 class="h4 mb-0" id="boardName">Cargando tablero…</h1>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary" id="btnRefresh" title="Actualizar"><i class="bi bi-arrow-clockwise"></i></button>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newTaskModal">
          <i class="bi bi-plus-lg me-1"></i>Nueva tarea
        </button>
      </div>
    </div>

    <div id="board" class="board-scroll"></div>
  </main>

  <!-- nueva tarea -->
  <div class="modal fade" id="newTaskModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <form class="modal-content" id="newTaskForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-plus-square me-1"></i>Nueva tarea</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="small text-muted">La tarea se crea en <strong>Por hacer</strong>.</p>
          <div class="mb-3">
            <label class="form-label">Título <span class="text-danger">*</span></label>
            <input type="text" class="form-control" name="title" maxlength="150">
          </div>
          <div class="mb-3">
            <label class="form-label">Descripción / criterio de aceptación</label>
            <textarea class="form-control" name="description" rows="3"></textarea>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Prioridad</label>
              <select class="form-select" name="priority">
                <option value="alta">Alta</option>
                <option value="media" selected>Media</option>
                <option value="baja">Baja</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Responsable</label>
              <select class="form-select" name="assignee_id"></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Fecha de inicio</label>
              <input type="date" class="form-control" name="start_date">
            </div>
            <div class="col-md-6">
              <label class="form-label">Fecha límite</label>
              <input type="date" class="form-control" name="due_date">
            </div>
            <div class="col-12">
              <label class="form-label">Etiquetas</label>
              <input type="text" class="form-control" name="labels" placeholder="frontend, bug, documentación">
              <div class="form-text">Separadas por coma.</div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Crear tarea</button>
        </div>
      </form>
    </div>
  </div>

  <!-- detalle de tarea -->
  <div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header align-items-start" id="tmHeader"></div>
        <div class="modal-body">
          <div class="row g-4">
            <div class="col-lg-8">
              <div id="tmMain"></div>

              <hr>
              <div class="section-title"><i class="bi bi-chat-left-text me-1"></i>Comentarios</div>
              <div id="tmComments" class="comments-box d-flex flex-column gap-2 mb-2"></div>
              <form id="commentForm" novalidate>
                <textarea class="form-control mb-2" name="body" rows="2" maxlength="2000"
                  placeholder="Escribe un comentario… (Ctrl+Enter para enviar)"></textarea>
                <div class="text-end">
                  <button type="submit" class="btn btn-sm btn-primary"><i class="bi bi-send me-1"></i>Comentar</button>
                </div>
              </form>
            </div>
            <div class="col-lg-4">
              <div id="tmSide"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/board.js"></script>
  <script src="/assets/js/task-modal.js"></script>
</body>
</html>
