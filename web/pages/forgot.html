<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña · TaskFlow</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="card auth-card shadow-lg border-0">
      <div class="card-body p-4 p-md-5">
        <h1 class="h4 mb-3"><i class="bi bi-key me-1"></i>Recuperar contraseña</h1>

        <div id="step1">
          <p class="text-muted small">Ingresa tu correo y te enviaremos un código de recuperación.</p>
          <form id="forgotForm" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="email" name="email" autocomplete="email">
            </div>
            <button type="submit" class="btn btn-primary w-100">Enviar código</button>
          </form>
        </div>

        <div id="step2" class="d-none">
          <div id="devHint" class="alert alert-info small d-none">
            <i class="bi bi-info-circle me-1"></i>Modo desarrollo: el código se llenó automáticamente
            (en producción llegaría por correo).
          </div>
          <form id="resetForm" novalidate>
            <div class="mb-3">
              <label for="token" class="form-label">Código de recuperación</label>
              <input type="text" class="form-control font-monospace" id="token" name="token">
            </div>
            <div class="mb-2">
              <label for="password" class="form-label">Nueva contraseña</label>
              <input type="password" class="form-control" id="password" name="password" maxlength="72" autocomplete="new-password">
            </div>
            <ul id="pwRules" class="pw-rules list-unstyled mb-3"></ul>
            <div class="mb-3">
              <label for="password2" class="form-label">Confirmar contraseña</label>
              <input type="password" class="form-control" id="password2" name="password2" maxlength="72" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-success w-100">Cambiar contraseña</button>
          </form>
        </div>

        <p class="text-center small mt-3 mb-0"><a href="/"><i class="bi bi-arrow-left"></i> Volver al inicio de sesión</a></p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>$(initForgot);</script>
</body>
</html>
