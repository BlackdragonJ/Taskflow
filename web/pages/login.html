<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · TaskFlow</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <style>
    /* Aseguramos que la pantalla ocupe toda la altura y centre el contenido perfectamente en cualquier dispositivo */
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8f9fa; /* Color de fondo sutil opcional para que resalte la tarjeta */
    }
    .auth-wrap {
      width: 100%;
      max-width: 420px; /* Ancho máximo ideal para móviles, tablets y escritorio */
      padding: 15px;
    }
  </style>
</head>
<body>
  <main class="auth-wrap">
    <div class="card auth-card shadow-lg border-0">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <i class="bi bi-kanban fs-1 text-primary"></i>
          <h1 class="h4 mt-2 mb-0">TaskFlow</h1>
          <p class="text-muted small">Gestión de tareas y proyectos</p>
        </div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" name="email" autocomplete="username" autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
        </form>

        <div class="d-flex justify-content-between mt-3 small">
          <a href="/forgot">¿Olvidaste tu contraseña?</a>
          <a href="/register">Crear cuenta</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>$(initLogin);</script>
</body>
</html>
